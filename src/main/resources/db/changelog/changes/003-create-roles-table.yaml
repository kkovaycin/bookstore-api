databaseChangeLog:

  - changeSet:
      id: 003-create-roles-table
      author: kubra

      changes:

        - createTable:
            tableName: roles

            columns:

              - column:
                  name: id
                  type: BIGSERIAL

                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)

                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: uk_roles_name