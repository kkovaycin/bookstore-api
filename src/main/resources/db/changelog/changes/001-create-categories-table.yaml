databaseChangeLog:

  - changeSet:
      id: 001-create-categories-table
      author: kubra

      changes:

        - createTable:
            tableName: categories

            columns:

              - column:
                  name: id
                  type: BIGSERIAL

                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)

                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: categories
            columnNames: name
            constraintName: uk_categories_name