databaseChangeLog:

  - changeSet:
      id: 002-create-products-table
      author: kubra

      changes:

        - createTable:
            tableName: products

            columns:

              - column:
                  name: id
                  type: BIGSERIAL

                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_products
                    nullable: false

              - column:
                  name: category_id
                  type: BIGINT

                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(200)

                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(12,2)

                  constraints:
                    nullable: false

              - column:
                  name: explanation
                  type: TEXT

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id

            referencedTableName: categories
            referencedColumnNames: id

            constraintName: fk_products_category
            onDelete: RESTRICT